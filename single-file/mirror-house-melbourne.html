          input.focus();
          return;

        status.textContent = 'Joining…';
        fetch('/api/newsletter', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: input.value })

            form.reset();
          })
          .catch(function (err) {

<!-- ========== PAGE: TRY IT IN YOUR ROOM (visualiser.html) ========== -->
<script type="text/html" id="page-room">
<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Try It in Your Room | Mirror House Melbourne</title>
  <meta name="description" content="See a Mirror House mirror in your own room. Snap a photo, tap the corners and place a real-size mirror with a live reflection. Your photo stays on your device.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Try It in Your Room | Mirror House Melbourne">
  <meta property="og:description" content="Place a real-size mirror in a photo of your room and see the reflection in 3D.">
  <meta property="og:image" content="/images/og-image.jpg">
  <meta property="og:locale" content="en_AU">

  <link rel="stylesheet" href="/css/theme.css">

  <style>
    :root { --hdr: 77px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .announcement-divider { opacity: 0.6; }

    /* ---------- page frame ---------- */
    .viz-intro { padding-block: 22px 4px; }
    .viz-title { font-family: var(--font-serif); font-weight: 500; margin: 6px 0 0; font-size: clamp(1.9rem, 3.2vw, 2.6rem); line-height: 1.05; }
    .viz-app {
      display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      grid-template-areas: "card stage"; gap: 24px; align-items: start;
      padding-block: 18px clamp(40px, 6vw, 72px);
    }
    .viz-stage { grid-area: stage; min-width: 0; position: sticky; top: calc(var(--hdr) + 14px); }
    .viz-viewport {
      position: relative; overflow: hidden; border-radius: 14px; background: var(--espresso); color: var(--on-dark);
      height: max(70vh, min(calc(100vh - var(--hdr) - 40px), 880px)); min-height: 440px;
    }
    .viz-viewport > canvas { display: block; width: 100%; height: 100%; outline: none; }
    .viz-viewport.is-dragging > canvas { cursor: grabbing; }

    /* ---------- step card ---------- */
    .step-card {
      grid-area: card; position: sticky; top: calc(var(--hdr) + 14px);
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px 22px; display: grid; gap: 14px; min-width: 0;
    }
    .step-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 12px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer;
      font-size: 0.95rem; font-weight: 500; color: var(--ink);
    }
    .back-btn:hover { border-color: var(--ink-2); }
    .back-btn[hidden] { display: inline-flex; visibility: hidden; }
    .step-dots { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .step-dots li { width: 10px; height: 10px; border-radius: 999px; background: var(--line); transition: width 0.25s var(--ease), background 0.25s; }
    .step-dots li.done { background: var(--brass); }
    .step-dots li[aria-current="step"] { width: 28px; background: var(--ink); }

    .step { display: grid; gap: 14px; min-width: 0; }
    .step[hidden] { display: none; }
    .step-title { margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 1.85rem; line-height: 1.05; outline: none; }
    .step-line { margin: -6px 0 0; color: var(--ink-2); font-size: 1rem; line-height: 1.4; }

    .big-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .big-btn {
      position: relative; display: grid; justify-items: center; align-content: center; gap: 8px;
      min-height: 120px; padding: 14px 8px; border-radius: 16px; cursor: pointer; text-align: center;
      background: var(--ink); color: var(--on-dark); font-size: 1.05rem; font-weight: 500; line-height: 1.2;
      border: 2px solid var(--ink); transition: background 0.2s, transform 0.15s var(--ease);
    }
    .big-btn:hover { background: var(--brass-deep); border-color: var(--brass-deep); }
    .big-btn:active { transform: scale(0.98); }
    .big-btn.light { background: var(--bg); color: var(--ink); }
    .big-btn.light:hover { background: var(--sand); }
    .big-btn svg { width: 38px; height: 38px; }
    .big-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .big-btn:focus-within { outline: 3px solid var(--brass); outline-offset: 3px; }
    .big-btn.is-over { outline: 3px dashed var(--brass); outline-offset: 3px; }

    .sub-label { margin: 2px 0 -6px; font-size: 0.82rem; color: var(--muted); letter-spacing: 0.04em; }
    .sample-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sample-thumb {
      display: grid; gap: 6px; padding: 6px; border: 2px solid var(--line); border-radius: 14px;
      background: var(--bg); cursor: pointer; text-align: center; font-size: 0.92rem; font-weight: 500; color: var(--ink);
    }
    .sample-thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 9px; background: var(--sand); }
    .sample-thumb:hover { border-color: var(--brass); }
    .sample-thumb[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 8%, var(--bg)); }

    .viz-msg { margin: 0; font-size: 0.92rem; line-height: 1.4; color: var(--ink-2); }
    .viz-msg:empty { display: none; }
    .viz-msg.error { color: #9A2E22; }

    .chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .chip-label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; color: var(--ink-2); margin-right: 2px; }
    .chip-label svg { width: 20px; height: 20px; }
    .chip {
      min-height: 48px; min-width: 64px; padding: 0 16px; border-radius: 999px; cursor: pointer;
      border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 0.95rem; font-weight: 500;
    }
    .chip:hover { border-color: var(--ink-2); }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-dark); }

<!DOCTYPE html>

<head>

<style>
/* Layout: an espresso header band, then a 12-column ledger of cards that summarises first
   (KPIs, attention, health) and drills into detail below. Brass is the only accent. */
:root {
  --bg: #F3EEE6;          /* sand page */
  --surface: #FBF8F2;     /* cream card */
  --surface-2: #F1EBE1;   /* inset well */
  --ink: #2A221B;         /* espresso */

  --line: #E3D9CA;
  --line-strong: #CBBDA9;
  --brass: #B08A3E;
  --brass-ink: #82621F;
  --band: #2A221B;
  --band-ink: #F3EDE3;
  --band-muted: #BCAE9B;
  --band-line: #4A3E33;
  --focus: #B08A3E;
  --tooltip-bg: #2A221B;
  --tooltip-ink: #F6F1E8;
  /* chart series (validated: light surface, all-pairs, CVD-safe) */
  --s1: #a67a12;
  --s2: #3a6db5;
  --s3: #d0607e;
  --s1-wash: rgba(166, 122, 18, 0.11);
  --spark: #9C8D7B;
  /* status */
  --good: #1F6B33;  --good-bg: #E3EEDF;
  --warn: #8A5600;  --warn-bg: #F8EBCF;
  --bad: #A3302B;   --bad-bg: #F6DEDA;
  --info: #4A5A6E;  --info-bg: #E6E9EC;
  --font-display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --font-sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110E; --surface: #1E1A16; --surface-2: #26211C;
    --ink: #F2EBE0; --ink-2: #CDBFAD; --muted: #A69887;
    --line: #342D26; --line-strong: #4C4238;
    --brass: #C9A55E; --brass-ink: #D6B571;
    --band: #0D0B09; --band-ink: #F2EBE0; --band-muted: #A69887; --band-line: #3A3129;
    --focus: #D6B571; --tooltip-bg: #F2EBE0; --tooltip-ink: #1E1A16;
    --s1: #b8892a; --s2: #4f86d0; --s3: #d8627f; --s1-wash: rgba(184, 137, 42, 0.10);
    --spark: #8C7F70;
    --good: #82CF8E; --good-bg: #1B2C1E;
    --warn: #EDC067; --warn-bg: #33291A;
    --bad: #F2948A;  --bad-bg: #3A211E;
    --info: #A9B8CB; --info-bg: #242A31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110E; --surface: #1E1A16; --surface-2: #26211C;
  --ink: #F2EBE0; --ink-2: #CDBFAD; --muted: #A69887;
  --line: #342D26; --line-strong: #4C4238;
  --brass: #C9A55E; --brass-ink: #D6B571;
  --band: #0D0B09; --band-ink: #F2EBE0; --band-muted: #A69887; --band-line: #3A3129;
  --focus: #D6B571; --tooltip-bg: #F2EBE0; --tooltip-ink: #1E1A16;
  --s1: #b8892a; --s2: #4f86d0; --s3: #d8627f; --s1-wash: rgba(184, 137, 42, 0.10);
  --spark: #8C7F70;
  --good: #82CF8E; --good-bg: #1B2C1E;
  --warn: #EDC067; --warn-bg: #33291A;
  --bad: #F2948A;  --bad-bg: #3A211E;
  --info: #A9B8CB; --info-bg: #242A31;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1380px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header band ---------- */
.band { background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--brass); }
.band .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1; letter-spacing: 0.005em; margin: 0; }
.brand-name span { color: var(--brass); padding: 0 0.18em; }
.brand-sub { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--band-muted); margin-top: 6px; }
.band-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.band a.navlink {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 500;
  color: var(--band-ink); padding: 8px 12px; border: 1px solid var(--band-line); border-radius: 999px;
}
.band a.navlink:hover { border-color: var(--brass); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 999px;
  border: 1px solid var(--band-line); background: transparent; color: var(--band-ink); cursor: pointer;
}
.icon-btn:hover { border-color: var(--brass); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- toolbar ---------- */
.toolbar .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 22px 6px; }
.toolbar h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(26px, 3.2vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--muted); font-size: 13px; margin-top: 6px; }
.demo-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--brass-ink); border: 1px solid var(--brass); border-radius: 999px; padding: 3px 10px;
}
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--ink-2);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--brass) inset; }

/* ---------- grid & cards ---------- */
main .inner { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; padding-block: 16px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.card-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; margin: 0; letter-spacing: 0.005em; text-wrap: balance; }
.card-head p, .sub { margin: 0; color: var(--muted); font-size: 13px; }
.section-label { grid-column: span 12; display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.section-label h2 { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 20px; color: var(--ink-2); margin: 0; white-space: nowrap; }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line-strong); }

/* ---------- KPI tiles ---------- */
.kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 12px; min-width: 0; display: grid; grid-template-rows: auto auto auto 1fr; gap: 4px; }
.kpi-label { font-size: 13px; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.kpi-label small { color: var(--muted); font-weight: 400; font-size: 12px; }
.kpi-value { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.kpi-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.flat { color: var(--muted); }
.spark { width: 100%; height: 40px; display: block; margin-top: 6px; align-self: end; }

/* ---------- status pills / severity ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.info { color: var(--info); background: var(--info-bg); }

.attention { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.attention li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.attention li:first-child { border-top: 0; padding-top: 2px; }
.attention .what { font-weight: 600; color: var(--ink); }
.attention .do { color: var(--ink-2); font-size: 13.5px; }
.attention .do b { font-weight: 600; color: var(--ink); }
.attention .where { color: var(--muted); font-size: 12px; }

.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checklist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; padding-top: 2px; }
.checklist .rule { color: var(--ink); font-weight: 500; }
.checklist .rule small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.checklist .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.score { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- charts ---------- */
.chart-box { position: relative; width: 100%; min-width: 0; }
.chart-box canvas { display: block; }
.h-260 { height: 260px; } .h-300 { height: 340px; } .h-220 { height: 220px; } .h-200 { height: 200px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 0; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.key.area { height: 10px; width: 10px; border-radius: 2px; }
.key.dash { background: repeating-linear-gradient(90deg, var(--ink-2) 0 4px, transparent 4px 7px) !important; height: 2px; }
.chart-summary { margin: 0; color: var(--ink-2); font-size: 13px; }
.chart-fallback { display: none; color: var(--muted); font-size: 13px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); }
.no-chart .chart-box { display: none; }
.no-chart .chart-fallback { display: block; }
details.data summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; font-weight: 500; width: max-content; max-width: 100%; }
details.data summary:hover { color: var(--ink); }
details.data[open] summary { margin-bottom: 8px; }

/* ---------- goal ---------- */
.goal-figure { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.goal-figure strong { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
.goal-figure span { color: var(--muted); }
.meter { position: relative; height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: visible; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--s1); }
.meter > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); border-radius: 1px; }
.meter-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.stat-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin: 0; }
.stat-list div { min-width: 0; }
.stat-list dt { color: var(--muted); font-size: 12.5px; }
.stat-list dd { margin: 2px 0 0; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-list dd small { font-size: 12.5px; font-weight: 500; color: var(--muted); }

#live[hidden] { display: none; }
.live-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.live-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

  const N = 730;

    { id: 'WM-WAVE-S', name: 'Wavy Wall Mirror, small 80 × 50', cat: 'Wall mirrors', price: 420, cogs: 150, freight: 54, charged: 0, pack: 34, packType: 'Timber crate', brk: 0.008, ret: 0.045, rate: 1.0, lead: 42, supplier: 'Foshan glass studio (CN)', cover: 118, onOrder: 0 },
    { id: 'LT-TRAV-TL', name: 'Travertine Table Lamp', cat: 'Lighting', price: 420, cogs: 168, freight: 38, charged: 0, pack: 9, packType: 'Moulded carton', brk: 0.004, ret: 0.04, rate: 0.9, lead: 63, supplier: 'Denizli stoneworks (TR)', cover: 88, onOrder: 0 },
    { id: 'LT-TRAV-WS', name: 'Travertine Wall Sconce', cat: 'Lighting', price: 280, cogs: 112, freight: 26, charged: 0, pack: 7, packType: 'Moulded carton', brk: 0.004, ret: 0.035, rate: 0.6, lead: 63, supplier: 'Denizli stoneworks (TR)', cover: 70, onOrder: 0 },
    { id: 'VS-SCULPT-T', name: 'Sculpted Ceramic Vase, tall', cat: 'Vases', price: 145, cogs: 52, freight: 24, charged: 8, pack: 6, packType: 'Carton', brk: 0.007, ret: 0.02, rate: 1.5, lead: 21, supplier: 'Brunswick ceramic studio (VIC)', cover: 40, onOrder: 0 },

    { id: 'GL-AMBER-C', name: 'Ribbed Amber Carafe', cat: 'Glassware', price: 75, cogs: 27, freight: 18, charged: 7, pack: 6, packType: 'Carton + dividers', brk: 0.012, ret: 0.02, rate: 0.9, lead: 35, supplier: 'Bohemian glassworks (CZ)', cover: 150, onOrder: 0 },
  ];
  const CATS = ['Floor mirrors', 'Wall mirrors', 'Lighting', 'Vases', 'Glassware'];
  const CHANNELS = [
    { key: 'organic', short: 'Organic', name: 'Organic search', share: 0.37, newShare: 0.78, ltvF: 1.0, spendMo: 1500, spendNote: 'SEO retainer' },
    { key: 'social', short: 'Insta / Pinterest', name: 'Instagram / Pinterest ads', share: 0.22, newShare: 0.86, ltvF: 0.9, spendMo: 5200 },
    { key: 'google', short: 'Google Ads', name: 'Google Ads', share: 0.09, newShare: 0.84, ltvF: 0.8, spendMo: 5600 },
    { key: 'email', short: 'Email', name: 'Email', share: 0.18, newShare: 0.22, ltvF: 1.55, spendMo: 450, spendNote: 'Platform fee' },
    { key: 'referral', short: 'Referral', name: 'Referral / stylists', share: 0.14, newShare: 0.80, ltvF: 1.25, spendMo: 0, spendNote: '10% stylist commission' },

  const SEASON = [0.86, 0.82, 0.92, 0.94, 1.02, 1.08, 0.90, 0.92, 0.98, 1.04, 1.28, 1.12];

        doit: `${worst} account for ${pct(cur.brkCat[worst] / cur.broken, 0)} of breakages (${money(cur.brkCost)} in replacements). Add corner blocks to the wavy-mirror crate and photograph crates at pickup.` });
    }
    if (cur.onTimeRate < 0.95) out.push({ sev: cur.onTimeRate < 0.92 ? 'bad' : 'warn', area: 'Freight', what: `On-time delivery is ${pct(cur.onTimeRate)}`,
      doit: `${int(cur.orders - cur.onTime)} deliveries ran late. Raise it with the fragile-freight carrier and quote 2 extra days for regional VIC and interstate.` });
    if (cur.revenue < cur.target * 0.98) out.push({ sev: 'warn', area: 'Sales', what: `Revenue is ${pct(1 - cur.revenue / cur.target)} behind plan`,
      doit: `${money(cur.target - cur.revenue)} short of the ${PERIOD_NAME[P]} plan. Run the Black Friday preview to the email list early.` });
    if (cur.gmPct < 0.40) out.push({ sev: 'warn', area: 'Margin', what: `Gross margin is ${pct(cur.gmPct)}`, doit: `Freight subsidy is ${money((cur.freight - cur.charged) / cur.ordersR)} an order. Test a $29 flat crate fee under $400.` });
    if (cur.returns > 0.05) out.push({ sev: 'warn', area: 'Returns', what: `Returns are ${pct(cur.returns)} of items`, doit: 'Review trial returns by product and add room-sizing guidance to floor mirror pages.' });
    // runway
    if (cash.runway != null && cash.runway < 6) out.push({ sev: 'bad', area: 'Cash', what: `Runway is ${cash.runway.toFixed(1)} months`, doit: 'Delay the next Christmas purchase order or negotiate 60-day terms.' });

    const order = { bad: 0, warn: 1, info: 2 };
    return out.sort((a, b) => order[a.sev] - order[b.sev]);

(function () {

<script type="text/plain" id="shared-theme-css">
/* Mirror House Melbourne storefront theme.
   Layout: editorial catalogue. Plaster-toned ground, espresso bands for the banner and footer,
   brass used only for small marks (tags, progress, focus). One deliberate light look. */
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap");

:root {
  --bg: #F7F3ED;          /* plaster */
  --surface: #FFFDF9;     /* card */
  --sand: #EEE6DA;        /* image wells, inset areas */
  --line: #E2D9CC;
  --ink: #1D1A17;
  --ink-2: #4A433C;
  --muted: #6B6259;
  --brass: #A8823A;
  --brass-deep: #7A5C22;
  --espresso: #26201B;
  --on-dark: #F3ECE2;
  --on-dark-muted: #B9AEA1;
  --overlay: rgba(29, 26, 23, 0.48);
  --good: #2F6B45;

  --font-serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-sans: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 3px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
body.no-scroll { overflow: hidden; }

.container {
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- announcement + header ---------- */
.announcement-bar {
  background: var(--espresso);
  color: var(--on-dark);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px;
  padding: 9px max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px));
  font-size: 0.78rem; letter-spacing: 0.06em; text-align: center;
}
.announcement-bar strong { color: #E3C98F; font-weight: 600; letter-spacing: 0.1em; }

.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px 28px; padding-block: 16px; }
.brand-logo { display: grid; gap: 2px; min-width: 0; }
.brand-title {
  font-family: var(--font-serif); font-weight: 600; font-size: 1.55rem; line-height: 1;
  letter-spacing: 0.24em; text-decoration: none;
}
.brand-subtitle { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

.site-nav { min-width: 0; justify-self: center; }
.nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 22px; }
.nav-link {
  text-decoration: none; font-size: 0.86rem; letter-spacing: 0.04em; color: var(--ink-2);
  padding-block: 6px; border-bottom: 1px solid transparent; white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.nav-link:hover, .nav-link.active { color: var(--ink); border-bottom-color: var(--brass); }

.header-actions { display: flex; align-items: center; gap: 10px; }
.admin-link-pill {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-size: 0.74rem; letter-spacing: 0.06em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
}
.admin-link-pill:hover { color: var(--ink); border-color: var(--ink-2); }
.action-btn {
  position: relative; display: inline-grid; place-items: center;
  width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; border-radius: 50%;
}
.action-btn:hover { background: var(--sand); }
.cart-count-badge {
  position: absolute; top: 3px; right: 1px; min-width: 19px; height: 19px; padding-inline: 5px;
  display: grid; place-items: center; border-radius: 999px;
  background: var(--ink); color: var(--on-dark); font-size: 0.68rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.cart-count-badge[data-empty="true"] { background: var(--line); color: var(--muted); }

@media (max-width: 1280px) { .admin-link-pill .label { display: none; } .admin-link-pill { padding: 8px; } }
@media (max-width: 1100px) {
  .header-inner { grid-template-columns: 1fr auto; }
  .site-nav { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
  .site-nav::-webkit-scrollbar { display: none; }
  .nav-links { gap: 20px; padding-inline: 4px; }
}
@media (max-width: 520px) {
  .brand-subtitle { display: none; }
  .brand-title { font-size: 1.22rem; letter-spacing: 0.16em; white-space: nowrap; }
  .admin-link-pill { padding: 8px; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 26px; border-radius: var(--radius); border: 1px solid transparent;
  font-family: var(--font-sans); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  text-decoration: none; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--on-dark); }
.btn-primary:hover { background: var(--brass-deep); }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-secondary:hover { background: var(--ink); color: var(--on-dark); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------- hero ---------- */
.hero-section { padding-block: clamp(72px, 11vw, 128px); }
.hero-content { max-width: 560px; display: grid; gap: 18px; justify-items: start; }
.hero-tag {
  display: inline-block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--brass-deep); background: color-mix(in srgb, var(--brass) 12%, transparent);
  padding: 6px 12px; border-radius: 999px;
}
.hero-title {
  font-family: var(--font-serif); font-weight: 500; margin: 0;
  font-size: clamp(2.6rem, 5.6vw, 4.4rem); line-height: 1.02; letter-spacing: -0.01em;
}
.hero-desc { margin: 0; font-size: 1.06rem; max-width: 46ch; color: var(--ink-2); }
.hero-cta-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

/* ---------- trust bar ---------- */
.trust-bar { background: var(--surface); border-block: 1px solid var(--line); }
.trust-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 20px 32px; padding-block: 26px; }
.trust-item { display: flex; align-items: center; gap: 14px; min-width: 0; }
.trust-icon { flex-shrink: 0; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--sand); }
.trust-info h4 { margin: 0; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.01em; }
.trust-info p { margin: 0; font-size: 0.8rem; color: var(--muted); line-height: 1.45; }

/* ---------- sections ---------- */
.section { padding-block: clamp(64px, 9vw, 104px); }
.section-header { text-align: center; max-width: 660px; margin: 0 auto 44px; display: grid; gap: 10px; justify-items: center; }
.section-subtitle { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass-deep); }
.section-title { font-family: var(--font-serif); font-weight: 500; font-size: clamp(2rem, 3.6vw, 2.9rem); line-height: 1.08; margin: 0; }
.section-desc { margin: 0; color: var(--muted); max-width: 52ch; }

/* ---------- catalogue ---------- */
.category-filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 40px; }
.filter-pill {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 8px 18px; font-size: 0.84rem; cursor: pointer; color: var(--ink-2);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.filter-pill:hover { border-color: var(--ink-2); color: var(--ink); }

    '<span class="drawer-subtotal-val" id="drawer-subtotal">$0</span></div>' +
    '<p class="drawer-tax-note">Shipping and optional breakage cover are calculated at checkout.</p>' +
    '<a href="/checkout.html" class="btn btn-primary drawer-checkout-btn" id="drawer-checkout-btn">Checkout Securely</a></div></aside>';

  function ensureDrawer() {
    if (!$('#cart-drawer')) document.body.insertAdjacentHTML('beforeend', DRAWER_HTML);
    var drawer = $('#cart-drawer');
    drawer.inert = true;
    drawer.setAttribute('aria-hidden', 'true');
  }

  var lastFocus = null;
  function openDrawer() {
    var drawer = $('#cart-drawer');
    lastFocus = document.activeElement;
    drawer.inert = false;
    drawer.removeAttribute('aria-hidden');
    drawer.classList.add('is-open');
    $('#cart-overlay').classList.add('is-open');
    document.body.classList.add('no-scroll');
    setTimeout(function () { var c = $('#close-cart-btn'); if (c) c.focus(); }, 60);
  }
  function closeDrawer() {
    var drawer = $('#cart-drawer');
    if (!drawer.classList.contains('is-open')) return;
    drawer.classList.remove('is-open');
    $('#cart-overlay').classList.remove('is-open');
    drawer.inert = true;
    drawer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function renderBag() {
    loadProducts().then(function (products) {
      var lines = bagLines(products);
      var count = lines.reduce(function (s, l) { return s + l.qty; }, 0);
      var subtotal = subtotalOf(lines);
      document.querySelectorAll('.cart-count-badge').forEach(function (b) {
        b.textContent = count;
        b.setAttribute('data-empty', count ? 'false' : 'true');
      });
      var btn = $('.open-cart-btn');
      if (btn) btn.setAttribute('aria-label', 'View shopping bag, ' + count + (count === 1 ? ' item' : ' items'));

      var list = $('#drawer-items-list');
      if (!list) return;
      if (!lines.length) {
        list.innerHTML = '<div class="drawer-empty"><p>Your bag is empty.</p>' +
          '<a class="btn btn-secondary" href="' + ($('#collection-section') ? '' : '/') + '#collection-section" data-close-drawer>Browse the collection</a></div>';
      } else {
        list.innerHTML = lines.map(function (l) {
          var p = l.product;
          return '<div class="drawer-item">' +
            '<img src="' + esc(imageFor(p.slug)) + '" alt="" width="76" height="95" loading="lazy">' +
            '<div><p class="drawer-item-name">' + esc(p.name) + '</p>' +
            '<div class="qty" role="group" aria-label="Quantity for ' + esc(p.name) + '">' +
            '<button type="button" data-qty="' + esc(p.slug) + '" data-delta="-1" aria-label="Remove one">−</button>' +
            '<span>' + l.qty + '</span>' +
            '<button type="button" data-qty="' + esc(p.slug) + '" data-delta="1" aria-label="Add one">+</button></div>' +
            '<br><button type="button" class="remove-btn" data-remove="' + esc(p.slug) + '">Remove</button></div>' +
            '<div class="drawer-item-price">' + money(p.price_cents * l.qty) + '</div></div>';
        }).join('');
      }
      var left = Math.max(0, FREE_FREIGHT_FROM - subtotal);
      $('#shipping-progress-text').textContent = !count
        ? 'Free fragile freight on orders over ' + money(FREE_FREIGHT_FROM)
        : left ? 'Add ' + money(left) + ' for free fragile freight' : 'Your order ships free, crated and tracked';
      $('#shipping-progress-fill').style.width = Math.min(100, (subtotal / FREE_FREIGHT_FROM) * 100) + '%';
      $('#drawer-subtotal').textContent = money(subtotal);
      var co = $('#drawer-checkout-btn');
      co.setAttribute('aria-disabled', count ? 'false' : 'true');
      co.style.opacity = count ? '' : '0.5';
    });
  }

  // ---------- catalogue ----------
  function cardHtml(p) {
    var badge = !p.in_stock ? '<span class="product-badge low">Sold out</span>'
      : p.badge ? '<span class="product-badge">' + esc(p.badge) + '</span>' : '';
    return '<article class="product-card">' +
      '<div class="product-media">' + badge +
      '<img src="' + esc(imageFor(p.slug)) + '" alt="' + esc(p.name) + '" width="800" height="1000" loading="lazy" decoding="async">' +
      '<button type="button" class="product-quick" data-quick="' + esc(p.slug) + '">Quick view</button></div>' +
      '<div class="product-info"><span class="product-cat">' + esc(p.category) + '</span>' +
      '<h3 class="product-name"><a href="' + esc(productUrl(p.slug)) + '" data-product-link="' + esc(p.slug) + '">' + esc(p.name) + '</a></h3>' +
      '<div class="product-row"><span class="product-price">' + money(p.price_cents) + '</span>' +
      '<button type="button" class="link-btn" data-add="' + esc(p.slug) + '"' + (p.in_stock ? '' : ' disabled') + '>' +
      (p.in_stock ? 'Add to bag' : 'Sold out') + '</button></div></div></article>';
  }

  function renderCatalogue(products) {
    var grid = $('#products-grid');
    var pills = $('#category-pills');
    if (!grid) return;
    var cats = [];
    products.forEach(function (p) { if (cats.indexOf(p.category) < 0) cats.push(p.category); });
    var active = query('category');
    if (active && cats.indexOf(active) < 0) active = null;

    function draw() {
      var shown = products.filter(function (p) { return !active || p.category === active; });
      grid.innerHTML = shown.length ? shown.map(cardHtml).join('') : '<p class="grid-note">Nothing in this category yet.</p>';
      if (pills) {
        pills.innerHTML = [null].concat(cats).map(function (c) {
          var n = c ? products.filter(function (p) { return p.category === c; }).length : products.length;
          return '<button type="button" class="filter-pill" data-cat="' + esc(c || '') + '" aria-pressed="' + (c === active) + '">' +
            esc(c || 'All') + '<span class="count">' + n + '</span></button>';
        }).join('');
      }
    }
    draw();
    if (pills) {
      pills.setAttribute('role', 'group');
      pills.setAttribute('aria-label', 'Filter by category');
      pills.addEventListener('click', function (e) {
        var b = e.target.closest('[data-cat]');
        if (b) setActive(b.getAttribute('data-cat') || null);
      });
    }
    function setActive(cat) {
      active = cats.indexOf(cat) >= 0 ? cat : null;
      draw();
      try {
        var url = new URL(location.href);
        if (active) url.searchParams.set('category', active); else url.searchParams.delete('category');
        history.replaceState(null, '', url);
      } catch (err) { /* preview frames may block history */ }
    }
    // Footer collection links filter in place on the home page instead of reloading it.
    showCategory = function (cat) {
      setActive(cat);
      var section = $('#collection-section');
      if (section) section.scrollIntoView({ behavior: 'smooth' });
    };
    if (active) {
      var section = $('#collection-section');
      if (section) section.scrollIntoView();
    }
  }
  var showCategory = null;

  // ---------- product detail (quick view and product page share this) ----------
  function detailHtml(p, headingTag) {
    var h = headingTag || 'h2';
    return '<div class="qv-media"><img src="' + esc(imageFor(p.slug)) + '" alt="' + esc(p.name) + '" width="800" height="1000"></div>' +
      '<div class="qv-body"><span class="product-cat">' + esc(p.category) + '</span>' +
      '<' + h + ' id="detail-title">' + esc(p.name) + '</' + h + '>' +
      '<div class="qv-price">' + money(p.price_cents) + '</div>' +
      '<p class="qv-desc">' + esc(p.desc || '') + '</p>' +
      (p.specs && p.specs.length ? '<ul class="spec-list">' + p.specs.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="qv-actions"><div class="qty" role="group" aria-label="Quantity">' +
      '<button type="button" data-detail-qty="-1" aria-label="Fewer">−</button><span id="detail-qty">1</span>' +
      '<button type="button" data-detail-qty="1" aria-label="More">+</button></div>' +
      '<button type="button" class="btn btn-primary" data-detail-add="' + esc(p.slug) + '"' + (p.in_stock ? '' : ' disabled') + '>' +
      (p.in_stock ? 'Add to bag' : 'Sold out') + '</button></div>' +
      '<p class="drawer-tax-note">Free fragile freight over ' + money(FREE_FREIGHT_FROM) + ' · 30-day in-home trial</p></div>';
  }

  var qvLastFocus = null;
  function openQuickView(p) {
    var overlay = $('#quickview-overlay');
    var content = $('#quickview-content');
    if (!overlay || !content) { location.href = productUrl(p.slug); return; }
    qvLastFocus = document.activeElement;
    content.innerHTML = detailHtml(p);
    var card = $('.quickview-card', overlay);
    if (card) { card.setAttribute('aria-labelledby', 'detail-title'); card.removeAttribute('aria-label'); }
    overlay.inert = false;
    overlay.classList.add('is-open');
    document.body.classList.add('no-scroll');
    setTimeout(function () { var c = $('#close-quickview-btn'); if (c) c.focus(); }, 60);
  }
  function closeQuickView() {
    var overlay = $('#quickview-overlay');
    if (!overlay || !overlay.classList.contains('is-open')) return;
    overlay.classList.remove('is-open');
    overlay.inert = true;
    document.body.classList.remove('no-scroll');
    if (qvLastFocus && qvLastFocus.focus) qvLastFocus.focus();
  }

  function renderProductPage(products) {
    var root = $('#product-detail');
    if (!root) return;
    var p = bySlug(products, query('slug') || '');
    if (!p) {
      root.innerHTML = '<div class="drawer-empty"><p>We couldn\'t find that piece.</p><a class="btn btn-secondary" href="/#collection-section">Browse the collection</a></div>';
      return;
    }
    document.title = p.name + ' | Mirror House Melbourne';
    var crumb = $('#crumb-name');
    if (crumb) crumb.textContent = p.name;
    root.innerHTML = detailHtml(p, 'h1');
  }

  // ---------- checkout ----------
  function renderCheckout(products) {
    var root = $('#checkout-root');
    if (!root) return;
    var lines = bagLines(products);
    if (!lines.length) {
      root.innerHTML = '<div class="panel confirmation"><h2>Your bag is empty</h2><p class="section-desc">Add a mirror or two, then come back to check out.</p>' +
        '<a class="btn btn-primary" href="/#collection-section">Browse the collection</a></div>';
      return;
    }
    root.innerHTML =
      '<form class="checkout-layout" id="checkout-form" novalidate>' +
      '<div class="panel"><h2>Delivery & options</h2>' +
      '<div class="field"><label for="co-email">Email for order updates</label><input id="co-email" type="email" autocomplete="email" required placeholder="you@example.com"></div>' +
      '<label class="option" for="co-cover"><input type="checkbox" id="co-cover"><span><strong>Transit & Breakage Cover</strong><small>Priority replacement if anything arrives damaged. Send photos within 48 hours.</small></span><span class="price">' + money(BREAKAGE_COVER) + '</span></label>' +
      '<label class="option" for="co-wg"><input type="checkbox" id="co-wg"><span><strong>White Glove delivery</strong><small>Two-person team carries it to your room of choice, unpacks it and takes the crate away.</small></span><span class="price">' + money(WHITE_GLOVE) + '</span></label>' +
      '<p class="drawer-tax-note">Payment by Square isn\'t connected in this demo. Your order is saved as pending and no card is charged.</p></div>' +
      '<div class="panel"><h2>Order summary</h2><ul class="summary-lines" id="co-lines"></ul>' +
      '<div class="summary-total"><span>Total (incl. GST)</span><span id="co-total"></span></div>' +
      '<button type="submit" class="btn btn-primary" id="co-submit">Place order</button>' +
      '<p class="form-msg" id="co-msg" role="status"></p></div></form>';

    function totals() {
      var subtotal = subtotalOf(lines);
      var freight = subtotal >= FREE_FREIGHT_FROM ? 0 : FLAT_FREIGHT;
      var cover = $('#co-cover').checked ? BREAKAGE_COVER : 0;
      var wg = $('#co-wg').checked ? WHITE_GLOVE : 0;
      var rows = lines.map(function (l) { return [l.product.name + ' × ' + l.qty, money(l.product.price_cents * l.qty)]; });
      rows.push(['Fragile freight', freight ? money(freight) : 'Free']);
      if (cover) rows.push(['Breakage cover', money(cover)]);
      if (wg) rows.push(['White Glove delivery', money(wg)]);
      $('#co-lines').innerHTML = rows.map(function (r) { return '<li><span>' + esc(r[0]) + '</span><span>' + r[1] + '</span></li>'; }).join('');
      $('#co-total').textContent = money(subtotal + freight + cover + wg);
    }
    totals();
    $('#co-cover').addEventListener('change', totals);
    $('#co-wg').addEventListener('change', totals);

    $('#checkout-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = $('#co-msg');
      var email = $('#co-email');
      msg.className = 'form-msg';
      if (!email.checkValidity()) { msg.textContent = 'Enter a valid email so we can send tracking updates.'; msg.className = 'form-msg error'; email.focus(); return; }
      if (PREVIEW) { msg.textContent = 'Orders are saved on the live site. This preview doesn\'t have the database behind it.'; return; }
      var submit = $('#co-submit');
      submit.disabled = true;
      msg.textContent = 'Placing your order…';
      fetch('/api/orders', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          email: email.value,
          items: lines.map(function (l) { return { slug: l.product.slug, qty: l.qty }; }),
          breakage_cover: $('#co-cover').checked,
          white_glove: $('#co-wg').checked
        })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.d.error || 'We couldn\'t place the order.');
          writeCart({});
          root.innerHTML = '<div class="panel confirmation"><div class="tick" aria-hidden="true">✓</div>' +
            '<h2>Order #' + esc(res.d.order_id) + ' received</h2>' +
            '<p class="section-desc">Total ' + money(res.d.total_cents) + '. We\'ll email ' + esc(email.value) + ' when it\'s crated and on its way.</p>' +
            '<a class="btn btn-secondary" href="/">Back to the shop</a></div>';
          root.scrollIntoView();
        })
        .catch(function (err) {
          submit.disabled = false;
          msg.textContent = err.message || 'We couldn\'t place the order. Please try again.';
          msg.className = 'form-msg error';
        });
    });
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target;
    var el;
    if ((el = t.closest('.open-cart-btn'))) { e.preventDefault(); openDrawer(); return; }
    if (t.closest('#close-cart-btn') || t.id === 'cart-overlay' || t.closest('[data-close-drawer]')) { closeDrawer(); return; }
    if (t.closest('#close-quickview-btn') || t.id === 'quickview-overlay') { closeQuickView(); return; }
    if ((el = t.closest('#drawer-checkout-btn'))) {
      if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); toast('Your bag is empty.'); }
      else if (PREVIEW) { e.preventDefault(); toast('This is a preview. Check out on the live shop: mirror-house-melbourne.zarko-ddc.workers.dev'); }
      return;
    }
    if ((el = t.closest('a[href*="category="]')) && showCategory) {
      var cat = null;
      try { cat = new URL(el.getAttribute('href'), location.href).searchParams.get('category'); } catch (err) { /* ignore */ }
      if (cat) { e.preventDefault(); showCategory(cat); return; }
    }
    if ((el = t.closest('[data-add]'))) {
      addToBag(el.getAttribute('data-add'), 1);
      loadProducts().then(function (ps) { var p = bySlug(ps, el.getAttribute('data-add')); toast((p ? p.name : 'Item') + ' added to your bag'); });
      return;
    }
    if ((el = t.closest('[data-quick]')) || (PREVIEW && (el = t.closest('[data-product-link]')))) {
      e.preventDefault();
      var slug = el.getAttribute('data-quick') || el.getAttribute('data-product-link');
      loadProducts().then(function (ps) { var p = bySlug(ps, slug); if (p) openQuickView(p); });
      return;
    }
    if ((el = t.closest('[data-detail-qty]'))) {
      var q = $('#detail-qty');
      q.textContent = Math.max(1, Math.min(20, parseInt(q.textContent, 10) + parseInt(el.getAttribute('data-detail-qty'), 10)));
      return;
    }
    if ((el = t.closest('[data-detail-add]'))) {
      addToBag(el.getAttribute('data-detail-add'), parseInt($('#detail-qty').textContent, 10) || 1);
      closeQuickView();
      openDrawer();
      return;
    }
    if ((el = t.closest('[data-qty]'))) {
      var s = el.getAttribute('data-qty');
      setQty(s, (readCart()[s] || 0) + parseInt(el.getAttribute('data-delta'), 10));
      return;
    }
    if ((el = t.closest('[data-remove]'))) { setQty(el.getAttribute('data-remove'), 0); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeQuickView(); closeDrawer(); }
  });
  window.addEventListener('storage', function (e) { if (e.key === 'mh-cart') renderBag(); });

  // ---------- boot ----------
  function boot() {
    ensureDrawer();
    var qv = $('#quickview-overlay');
    if (qv) qv.inert = true;
    renderBag();
    loadProducts().then(function (products) {
      renderCatalogue(products);
      renderProductPage(products);
      renderCheckout(products);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>


<!-- ========== SHARED: 3D ROOM SCRIPT (js/visualiser.js) ========== -->
<script type="text/plain" id="shared-visualiser-js">
// Mirror House Melbourne: "Try it in your room" visualiser.
//
// A guided, four-step flow: add a room photo, tap the corners, pick a mirror, look around.
//
// How the room is rebuilt from one photo ("tour into the picture", Horry et al. 1997, generalised):
//  * The photo is a pinhole camera at the origin, principal point at the image centre, zero roll.
//    Focal length comes from a lens angle across the photo's LONG side (phone main camera ~69°).
//  * The shopper drags dots onto the room's corner posts: each post has a floor dot (where walls meet
//    the floor) and a top dot (where they meet the ceiling, or the top of the visible wall). Posts at the
//    photo's left/right edge mark where a wall runs out of frame. Consecutive posts bound one wall.
//  * Corner posts are vertical 3D lines, so their convergence gives the camera pitch. If they're parallel
//    (a level or cropped shot), eye level comes from the walls' horizontal vanishing points instead.
//    Two adjacent walls' vanishing points can also refine the lens (orthogonal directions).
//  * Floor dots are cast onto the floor plane; top dots give the ceiling; the ceiling height (Low /
//    Normal / High) sets the real-world scale. Distances are capped at 12 m with a nudge on that dot.
//  * Every surface is painted with the photo by projecting it back out of the original camera
//    (one ShaderMaterial). Areas the photo can't see are folded back into territory it can.
//  * The mirror is real-size geometry with a planar Reflector, so it reflects the rebuilt room.
// Everything runs in the browser. Photos are never uploaded.

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DEG = Math.PI / 180;
const $ = (sel, root = document) => root.querySelector(sel);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const median = (arr) => {
  if (!arr.length) return NaN;
  const s = [...arr].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const MAX_DIST = 12;         // metres: floor dots further than this are capped and nudged
const STANDOFF = 0.015;      // gap between wall and mirror back
const LEAN = 6 * DEG;        // floor mirror lean
const BRASS = 0xC9A45C;
const DEFAULT_LENS = 69;     // across the long side: a phone's 26 mm main camera

// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------

// Posts are in image fractions (0..1, y down). Sample photos were cropped off-centre, so they carry a
// tuned eye level (horizon) as a manual override, and a tuned lens.
const SAMPLES = {
  living: {
    src: '/images/rooms/living.jpg', label: 'Living room', horizon: 0.44, lens: 66,
    posts: [
      { edge: 'l', fx: 0, fy: 0.8075, cx: 0, cy: 0 },
      { fx: 0.217, fy: 0.6445, cx: 0.217, cy: 0.177 },
      { fx: 0.7725, fy: 0.6445, cx: 0.7725, cy: 0.177 },
      { edge: 'r', fx: 1, fy: 0.824, cx: 1, cy: 0 }
    ],
    spot: { wall: 1, frac: 0.66 }, floorSpot: { wall: 1, frac: 0.66 }
  },
  bedroom: {
    src: '/images/rooms/bedroom.jpg', label: 'Bedroom', horizon: 0.452, lens: 66,
    posts: [
      { edge: 'l', fx: 0, fy: 0.783, cx: 0, cy: 0 },
      { fx: 0.209, fy: 0.6535, cx: 0.209, cy: 0.179 },
      { fx: 0.7756, fy: 0.6535, cx: 0.7756, cy: 0.179 },
      { edge: 'r', fx: 1, fy: 0.816, cx: 1, cy: 0 }
    ],
    spot: { wall: 1, frac: 0.5 }, floorSpot: { wall: 2, frac: 0.55 }
  }
};

// Default dots for an upload: a plausible room (camera 1.35 m up, 2.7 m ceiling) seen through a phone's
// main camera, so most photos need only small nudges. Sized for the photo's shape.
function layoutPreset(kind, photo) {
  const w = photo ? photo.w : 1600, h = photo ? photo.h : 1200;
  const f = (Math.max(w, h) / 2) / Math.tan(DEFAULT_LENS * DEG / 2);
  const cam = 1.35, up = 2.7 - cam;
  if (kind === 'two') {
    // Looking into a corner 5.5 m away; both walls at 45°, so their vanishing points sit at x = c ± f.
    const t = (w / 2 + f) / f;
    const yb = clamp(0.5 + f * cam / 5.5 / h, 0.58, 0.5 + 0.46 / t), yt = clamp(0.5 - f * up / 5.5 / h, 0.5 - 0.46 / t, 0.42);
    const ey = (y) => clamp(0.5 + t * (y - 0.5), 0.03, 0.97);
    return [
      { edge: 'l', fx: 0, fy: ey(yb), cx: 0, cy: ey(yt) },
      { fx: 0.5, fy: yb, cx: 0.5, cy: yt },
      { edge: 'r', fx: 1, fy: ey(yb), cx: 1, cy: ey(yt) }
    ];
  }
  // Three walls, one-point view: a back wall about 4 m wide and 5 m away, side walls running out of frame.
  const x0 = clamp(0.5 - f * 2 / 5 / w, 0.15, 0.36), x1 = 1 - x0;
  const te = 0.5 / (0.5 - x0);   // how far the side-wall seams run from the corner to the photo edge
  const yb = clamp(0.5 + f * cam / 5 / h, 0.58, Math.min(0.86, 0.5 + 0.47 / te)), yt = clamp(0.5 - f * up / 5 / h, 0.1, 0.4);
  const edgeAt = (x, xc) => {
    const t = (x - 0.5) / (xc - 0.5);
    return { fy: clamp(0.5 + t * (yb - 0.5), 0.02, 0.98), cy: clamp(0.5 + t * (yt - 0.5), 0, 0.98) };
  };
  const L = edgeAt(0, x0), R = edgeAt(1, x1);
  return [
    { edge: 'l', fx: 0, fy: L.fy, cx: 0, cy: L.cy },
    { fx: x0, fy: yb, cx: x0, cy: yt },
    { fx: x1, fy: yb, cx: x1, cy: yt },
    { edge: 'r', fx: 1, fy: R.fy, cx: 1, cy: R.cy }
  ];
}

// ---------------------------------------------------------------------------
// Geometry: posts -> camera + room
// ---------------------------------------------------------------------------

const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

// Image line through two pixel points (homogeneous), and a finite intersection or null.
function lineThrough(p, q) { return cross3([p[0], p[1], 1], [q[0], q[1], 1]); }
function meet(l1, l2, cx, cy, L) {
  const v = cross3(l1, l2);
  if (Math.abs(v[2]) < 1e-9) return null;
  const x = v[0] / v[2], y = v[1] / v[2];
  if (!isFinite(x) || !isFinite(y) || Math.hypot(x - cx, y - cy) > 25 * L) return null;
  // Reject near-parallel lines (vanishing point far outside): weak information.
  return [x, y];
}

// Camera pitch from corner posts (vertical 3D lines). Least squares on the vertical direction
// (0, cos p, -sin p) lying in each post's plane through the camera.
function pitchFromPosts(px, f, cx, cy) {
  let a = 0, b = 0, d = 0, count = 0;
  for (const p of px) {
    if (p.edge) continue;
    const r1 = [(p.fu - cx) / f, (cy - p.fv) / f, -1];
    const r2 = [(p.cu - cx) / f, (cy - p.cv) / f, -1];
    const n = cross3(r1, r2);
    const len = Math.hypot(n[0], n[1], n[2]);
    if (len < 1e-9) continue;
    const ny = n[1] / len, nz = n[2] / len;
    a += ny * ny; b -= ny * nz; d += nz * nz; count++;
  }
  if (!count || a + d < 1e-7) return 0;
  const tr = a + d, det = a * d - b * b;
  const disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
  const lmin = tr / 2 - disc, lmax = tr / 2 + disc;
  if (lmax < 1e-7) return 0;
  let c, s;
  if (Math.abs(b) > 1e-12) { c = b; s = lmin - a; } else if (a <= d) { c = 1; s = 0; } else { return 0; }
  if (c < 0) { c = -c; s = -s; }
  return clamp(Math.atan2(s, c), -30 * DEG, 30 * DEG);
}

function solveLayout(photo, posts, opt) {
  const { w, h } = photo;
  const L = Math.max(w, h);
  const ccx = w / 2;
  const px = posts.map((p) => ({
    fu: p.fx * w, fv: p.fy * h, cu: p.cx * w, cv: p.cy * h, edge: p.edge || null, top: p.cy <= 0.012
  }));
  const n = px.length;

  // Horizontal vanishing points: each wall's floor line meets its ceiling line; opposite walls'
  // floor lines meet too (rectangular room).
  const floorLines = [], wallVps = [];
  for (let j = 0; j < n - 1; j++) {
    const a = px[j], b = px[j + 1];
    floorLines.push(lineThrough([a.fu, a.fv], [b.fu, b.fv]));
    const ceil = !a.top && !b.top ? lineThrough([a.cu, a.cv], [b.cu, b.cv]) : null;
    wallVps.push(ceil ? meet(floorLines[j], ceil, ccx, h / 2, L) : null);
  }
  const oppVps = [];
  for (let j = 0; j + 2 < n - 1; j++) oppVps.push(meet(floorLines[j], floorLines[j + 2], ccx, h / 2, L));

  const fManual = (L / 2) / Math.tan(opt.lens * DEG / 2);
  let f = fManual;
  let cy = h / 2, pitch = 0, horizonSource = 'centre';

  const level = Math.abs(pitchFromPosts(px, fManual, ccx, h / 2)) < 1.5 * DEG;
  if (opt.horizon != null) {
    cy = opt.horizon * h; horizonSource = 'manual';
  } else if (level) {
    const ys = [...wallVps, ...oppVps].filter(Boolean).map((v) => v[1]).filter((y) => y > -0.3 * h && y < 1.3 * h);
    if (ys.length) { cy = clamp(median(ys), 0.2 * h, 0.8 * h); horizonSource = 'walls'; }
  }

  // Lens from two adjacent walls' vanishing points (orthogonal directions).
  const fEst = [];
  for (let j = 0; j + 1 < wallVps.length; j++) {
    const v1 = wallVps[j], v2 = wallVps[j + 1];
    if (!v1 || !v2) continue;
    const f2 = -((v1[0] - ccx) * (v2[0] - ccx) + (v1[1] - cy) * (v2[1] - cy));
    if (f2 <= 0) continue;
    const fov = 2 * Math.atan((L / 2) / Math.sqrt(f2)) / DEG;
    if (fov >= 45 && fov <= 110) fEst.push(Math.sqrt(f2));
  }
  const fAuto = fEst.length ? median(fEst) : null;
  if (opt.lensMode === 'auto' && fAuto) f = fAuto;
  if (opt.horizon == null && !level) { pitch = pitchFromPosts(px, f, ccx, h / 2); horizonSource = 'pitch'; }

  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
  const ray = (u, v) => {
    const x = (u - ccx) / f, y = (cy - v) / f, z = -1;
    return [x, y * cosP - z * sinP, y * sinP + z * cosP];
  };

  // Unit-height pass (camera 1 above the floor), then scale.
  function pass(maxUnits) {
    const floor = px.map((p) => {
      const d = ray(p.fu, p.fv);
      let P, capped = false;
      if (d[1] < -1e-6) {
        const t = -1 / d[1];
        P = [d[0] * t, -1, d[2] * t];
        const rho = Math.hypot(P[0], P[2]);
        if (rho > maxUnits) { P = [P[0] / rho * maxUnits, -1, P[2] / rho * maxUnits]; capped = true; }
      } else {
        const hl = Math.hypot(d[0], d[2]) || 1;
        P = [d[0] / hl * maxUnits, -1, d[2] / hl * maxUnits]; capped = true;
      }
      return { P, capped };
    });
    const ceil = px.map((p, i) => {
      const d = ray(p.cu, p.cv);
      const P = floor[i].P;
      let yc = NaN;
      if (p.edge) {
        // Edge post: top dot lies on the wall plane of its one wall.
        const j = i === 0 ? 1 : i - 1;
        const A = floor[i].P, B = floor[j] ? floor[j].P : null;
        if (B) {
          const nx = -(B[2] - A[2]), nz = B[0] - A[0];
          const den = nx * d[0] + nz * d[2];
          if (Math.abs(den) > 1e-9) {
            const t = (nx * A[0] + nz * A[2]) / den;
            if (t > 0) yc = t * d[1];
          }
        }
      }
      if (!(yc > 0)) {
        const hh = d[0] * d[0] + d[2] * d[2];
        const t = hh > 1e-12 ? (d[0] * P[0] + d[2] * P[2]) / hh : -1;
        if (t > 0) yc = t * d[1];
      }
      return yc > 0.05 && yc < 20 ? yc : NaN;
    });
    const onCeiling = ceil.filter((v, i) => isFinite(v) && !px[i].top);
    const any = ceil.filter((v) => isFinite(v));
    let H, roomH, scale;
    if (opt.ceilingMode && onCeiling.length) {
      H = opt.ceilingH / (1 + median(onCeiling)); roomH = opt.ceilingH; scale = 'ceiling';
    } else {
      H = opt.camH;
      const m = onCeiling.length ? median(onCeiling) : any.length ? median(any) : 1.8;
      roomH = H * (1 + m);
      if (!onCeiling.length) roomH = Math.max(roomH, 2.4);
      scale = 'camera';
    }
    H = clamp(H, 0.3, 3.5);
    return { floor, ceil, H, roomH, scale, noCeiling: !onCeiling.length };
  }
  let r = pass(MAX_DIST / 1.5);
  r = pass(MAX_DIST / r.H);
  const H = r.H, roomH = Math.max(r.roomH, H + 0.3);
  const yF = -H, yC = roomH - H;

  const F = r.floor.map((fp) => [fp.P[0] * H, fp.P[2] * H]);   // [x, z] in metres
  const walls = [];
  for (let j = 0; j < n - 1; j++) {
    const A = F[j], B = F[j + 1];
    const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const t = len > 1e-6 ? [(B[0] - A[0]) / len, (B[1] - A[1]) / len] : [1, 0];
    let nrm = [-t[1], t[0]];
    if (-(nrm[0] * A[0] + nrm[1] * A[1]) < 0) nrm = [-nrm[0], -nrm[1]];
    walls.push({
      i: j, A, B, len, t, n: nrm, dist: Math.abs(nrm[0] * A[0] + nrm[1] * A[1]),
      partial: !!(px[j].edge || px[j + 1].edge), facing: nrm[1]
    });
  }
  let mainWall = 0, best = -Infinity;
  walls.forEach((wl) => { const sc = wl.len * Math.max(0.15, wl.facing); if (wl.len > 0.3 && sc > best) { best = sc; mainWall = wl.i; } });

  // Friendly nudges: one per dot, in plain words.
  const nudges = [];
  const nudge = (post, end, text) => { if (!nudges.some((q) => q.post === post && q.end === end)) nudges.push({ post, end, text }); };
  px.forEach((p, i) => {
    if (r.floor[i].capped) nudge(i, 'floor', 'Move me down to the floor');
    if (p.fv < p.cv - 4) nudge(i, 'floor', 'Move me below the top dot');
  });
  walls.forEach((wl) => {
    const far = Math.hypot(...F[wl.i]) > Math.hypot(...F[wl.i + 1]) ? wl.i : wl.i + 1;
    if (wl.dist > 10 || wl.len > 10) nudge(far, 'floor', 'Move me down to the floor');
    if (!wl.partial && wl.len < 0.8) nudge(wl.i + 1, 'floor', 'Slide me to the corner');
  });
  const firstTop = px.findIndex((p) => !p.edge && !p.top);
  const topDot = firstTop >= 0 ? firstTop : 0;
  if (r.scale === 'ceiling' && (H < 0.45 || H > 2.4)) nudge(topDot, 'ceil', 'Move me to the ceiling line');
  if (r.scale === 'camera' && (roomH > 4.6 || roomH < 2.0) && !r.noCeiling) nudge(topDot, 'ceil', 'Move me to the ceiling line');

  // Closure behind the camera so reflections have a room to show.
  const maxDepth = Math.max(1.5, ...F.map((p) => -p[1]));
  const Zf = Math.max(1.2, 0.45 * maxDepth);
  function closure(end, inner, isEdge, sideSign) {
    const out = [];
    if (isEdge && inner) {
      let dx = end[0] - inner[0], dz = end[1] - inner[1];
      const l = Math.hypot(dx, dz) || 1;
      dx /= l; dz /= l;
      if (dz > 0.2) {
        const tz = (Zf - end[1]) / dz;
        const t = Math.min(tz, Math.max(2, l));
        out.push([end[0] + dx * t, end[1] + dz * t]);
      }
    }
    const last = out.length ? out[out.length - 1] : end;
    let x = last[0];
    if (sideSign < 0) x = Math.min(x, -0.6); else x = Math.max(x, 0.6);
    if (last[1] < Zf - 1e-3 || x !== last[0]) out.push([x, Zf]);
    return out;
  }
  const leftClose = closure(F[0], F[1], !!px[0].edge, -1).reverse();     // ordered toward F[0]
  const rightClose = closure(F[n - 1], F[n - 2], !!px[n - 1].edge, 1);   // ordered away from F[n-1]
  const poly = [...leftClose, ...F, ...rightClose];
  const segs = [];
  for (let k = 0; k < poly.length; k++) {
    const a = poly[k], b = poly[(k + 1) % poly.length];
    const fIdx = k - leftClose.length;
    let kind = 'closure', wallIndex = -1;
    if (fIdx >= 0 && fIdx < n - 1) { kind = 'wall'; wallIndex = fIdx; }
    if (k === poly.length - 1) kind = 'front';
    segs.push({ a, b, kind, wallIndex });
  }

  const xs = F.map((p) => p[0]);
  return {
    w, h, f, cx: ccx, cy, pitch, horizonSource, fAuto, fManual,
    lensDeg: 2 * Math.atan((L / 2) / f) / DEG, lensAutoDeg: fAuto ? 2 * Math.atan((L / 2) / fAuto) / DEG : null,
    H, roomH, yF, yC, scale: r.scale, noCeiling: r.noCeiling,
    F, walls, mainWall, poly, segs, maxDepth, Zf, nudges,
    capped: r.floor.map((x) => x.capped),
    size: { width: Math.max(...xs) - Math.min(...xs), depth: maxDepth }
  };
}

function hasWebGL2() {
  try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; }
}

let renderer, scene, camera, controls, roomMaterial, photoTexture;
const roomGroup = new THREE.Group();
let wallMeshes = [];
let mirror = null;
let needsRender = true;
let rafId = 0;
let lastGoodCam = new THREE.Vector3();

function initThree() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

  renderer.setClearColor(0x26201b, 1);
  const canvas = renderer.domElement;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', 'Your room in 3D with the mirror. Drag the mirror to move it, drag the room to look around, tap a wall to move the mirror there.');
  canvas.style.touchAction = 'none';
  el.viewport.prepend(canvas);
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();

  });

  scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  pmrem.dispose();
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
  sun.position.set(2.5, 3.5, 2);
  scene.add(sun, sun.target, new THREE.HemisphereLight(0xfff8ee, 0x8a7560, 0.35));

  camera = new THREE.PerspectiveCamera(50, 1, 0.03, 120);
  controls = new OrbitControls(camera, canvas);
  controls.enablePan = false;
  controls.enableDamping = !reduceMotion.matches;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.7;
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  controls.addEventListener('change', () => { needsRender = true; });
  reduceMotion.addEventListener?.('change', () => { controls.enableDamping = !reduceMotion.matches; });

  roomMaterial = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: {
      map: { value: null },
      fpx: { value: 1000 }, iw: { value: 1600 }, ih: { value: 1200 }, pcx: { value: 800 }, pcy: { value: 600 },
      cosP: { value: 1 }, sinP: { value: 0 }, maxDepth: { value: 6 }
    },
    vertexShader: /* glsl */`
      attribute vec3 aSample;
      attribute float aShade;
      varying vec3 vSample;
      varying float vShade;
      void main() {
        vSample = aSample;
        vShade = aShade;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map;
      uniform float fpx, iw, ih, pcx, pcy, cosP, sinP, maxDepth;
      varying vec3 vSample;
      varying float vShade;

      // World -> original camera (pitched about X, zero roll).
      vec3 toCam(vec3 p) { return vec3(p.x, p.y * cosP + p.z * sinP, -p.y * sinP + p.z * cosP); }
      vec2 uvOf(vec3 p) {
        vec3 c = toCam(p);
        float iz = 1.0 / max(-c.z, 1e-4);
        return vec2((pcx + fpx * c.x * iz) / iw, 1.0 - (pcy - fpx * c.y * iz) / ih);
      }
      bool covered(vec3 p) {
        if (toCam(p).z > -0.05) return false;
        vec2 uv = uvOf(p);
        return uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0;
      }
      // o folded back and forth inside 0..L, so it never runs off the room.
      float foldRange(float o, float L) { float m = mod(o, 2.0 * L); return L - abs(L - m); }

      void main() {
        vec3 p = vSample;
        float shade = vShade;
        if (!covered(p)) {
          // Not in the photo (beside, below or behind the camera): slide the point deeper along the
          // room (same floor, wall or ceiling) to where the photo first sees it, mirrored about there.
          float lo = 0.3, hi = maxDepth, need = maxDepth;
          if (covered(vec3(p.x, p.y, -hi))) {
            for (int i = 0; i < 12; i++) {
              float mid = 0.5 * (lo + hi);
              if (covered(vec3(p.x, p.y, -mid))) hi = mid; else lo = mid;
            }
            need = hi;
          }
          float d0 = -p.z;
          if (d0 < need) p.z = -(need + foldRange(need - d0, max(maxDepth - need, 0.3)));
          shade *= 0.92;
        }
        vec2 uv = uvOf(p);
        uv = 1.0 - abs(1.0 - abs(uv));
        uv = clamp(uv, vec2(0.0005), vec2(0.9995));
        gl_FragColor = vec4(texture2D(map, uv).rgb * shade, 1.0);
        #include <colorspace_fragment>
      }`
  });

  new ResizeObserver(() => resize()).observe(el.viewport);
  resize();
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopLoop(); else startLoop(); });
  startLoop();
}

function viewSize() { return { w: Math.max(1, el.viewport.clientWidth), h: Math.max(1, el.viewport.clientHeight) }; }
function reflectorSize() {
  const { w, h } = viewSize();
  const pr = renderer.getPixelRatio();
  return { w: Math.min(2048, Math.round(w * pr)), h: Math.min(2048, Math.round(h * pr)) };
}

function resize() {
  if (renderer) {
    const { w, h } = viewSize();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    fitCameraLens();
    if (mirror) { const rs = reflectorSize(); mirror.reflector.getRenderTarget().setSize(rs.w, rs.h); }
    needsRender = true;
  }
  if (state.step === 2) layoutEditor();
}

// Match the 3D camera's lens to the photo: the photo "covers" the viewport, eye level where it was.
function fitCameraLens() {
  if (!camera) return;
  const { w, h } = viewSize();
  const aspect = w / h;
  const L = state.layout;
  let tanVc = 0.5, shiftY = 0;
  if (L) {
    const tanHp = (L.w / 2) / L.f, tanVp = (L.h / 2) / L.f;
    tanVc = aspect >= L.w / L.h ? tanHp / aspect : tanVp;
    shiftY = ((L.cy - L.h / 2) / L.f) / tanVc;
  }
  camera.aspect = aspect;
  camera.fov = 2 * Math.atan(tanVc) / DEG;
  camera.updateProjectionMatrix();
  camera.projectionMatrix.elements[9] = shiftY;
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

function resetView() {
  const L = state.layout;
  if (!L || !controls) return;
  const dist = clamp(L.walls[L.mainWall] ? L.walls[L.mainWall].dist : 4, 1.5, MAX_DIST);

// 3D pointer: drag the mirror, tap a wall
// ---------------------------------------------------------------------------

const raycaster = new THREE.Raycaster();

    lens: state.lens, lensMode: state.lensMode, horizon: state.horizon,

}

};

  const lens = L.lensAutoDeg && state.lensMode === 'auto' ? `Lens auto ${Math.round(L.lensAutoDeg)}°` : `Lens ${Math.round(L.lensDeg)}°`;

// Photo loading
// ---------------------------------------------------------------------------

function blobToImage(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('decode'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('read'));
    reader.readAsDataURL(blob);
  });
}
async function decodePhoto(blob) {
  let src;

  catch (e) { src = await blobToImage(blob); }
